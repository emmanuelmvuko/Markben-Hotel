    <main>
        <section class="booking">
            <div class="booking-form">
                <h2>Book Your Stay</h2>
                <form action="form.php" id="bookingForm" method="post" data-booking>
                    <div class="field">
                        <label for="firstname">First name</label>
                        <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
                    </div>
                    <div class="field">
                        <label for="lastname">Last name</label>
                        <input type="text" id="lastname" name="lastname" autocomplete="family-name" required>
                    </div>
                    <div class="field">
                        <label for="arrivalDate">Arrival date</label>
                        <input type="date" id="arrivalDate" name="arrivaldate" required>
                    </div>
                    <div class="field">
                        <label for="departureDate">Departure date</label>
                        <input type="date" id="departureDate" name="departuredate" required>
                    </div>
                    <div class="field">
                        <label for="adults">Number of adults</label>
                        <input type="number" id="adults" name="adultoptn" min="1" max="6" value="1" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="children">Number of children</label>
                        <input type="number" id="children" name="childrenoptn" min="0" max="8" value="0" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="rooms">Number of rooms</label>
                        <input type="number" id="rooms" name="roomoptn" min="1" max="6" value="1" inputmode="numeric" required>
                    </div>
                    <div class="field">
                        <label for="roompackage">Room package</label>
                        <select id="roompackage" name="roompackage">
                        <option value="Luxury Suite">Luxury Suite</option>
                        <option value="Business Traveler">Business Traveler</option>
                        <option value="Coastal Retreat">Coastal Retreat</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="findRoomButton">Book</button>
                </form>
            </div>
        </section>
    </main>
